<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Rakeen Khan 78953 -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Block with Text</title>
    <meta name="description" content="An above-the-fold hero block with animated text and various background colours.">
    <!-- Link to Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Custom styles -->
    <style type="text/tailwindcss">

@keyframes bg-change {
    0%   { background-color: red }
    100% { background-color: yellow }
}
/* ----------------------------------------------
 * Generated by Animista on 2026-10-16 10:30:30
 * Licensed under FreeBSD License.
 * See http://animista.net/license for more info. 
 * w: http://animista.net, t: @cssanimista
 * ---------------------------------------------- */

/**
 * ----------------------------------------
 * animation slide-in-top
 * ----------------------------------------
 */
@keyframes slide-in-top {
    0% {
        transform: translateY(-1000px);
        opacity: 0;
    }
    100% {
        transform: translateY(0);
        opacity: 1;
    }
}

@keyframes slide-in-left {
    0% {
        transform: translateX(-1000px);
        opacity: 0;
    }
    100% {
        transform: translateX(0);
        opacity: 1;
    }
}

header { 
@apply min-h-screen min-h-[100svh]
    bg-linear-to-b from-blue-600 to-purple-900
    flex flex-col justify-center
    px-8 lg:px-60 py-12
    text-center;
}

.change-background-color {
    background-color: red;
    animation-name: bg-change;
    animation-duration: 4s;
}
.slide-in-left {
	animation: slide-in-left 0.5s cubic-bezier(0.250, 0.460, 0.450, 0.940) both;
}

.slide-in-top {
    animation: slide-in-top 1.5s cubic-bezier(0.250, 0.460, 0.450, 0.940) both;
}

        header h1 {
    @apply text-7xl md:text-8xl
        text-white font-bold
        tracking-tight
        mb-6;
}

        header h2 {
            @apply text-4xl md:text-5xl
            text-white;
        }

    </style>

</head>


<body>

    <!-- hero block -->
     <header>
        <h1 class="slide-in-top">Rakeen Khan</h1>

        <h2 class="slide-in-left">Creative Web Developer</h2>
        <p><a href="index.html">Back to Home page</a></p>
    </header>
    <!-- /hero block -->

</body>
</html>
